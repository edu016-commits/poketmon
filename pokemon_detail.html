<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>포켓몬 상세 | 1세대</title>
<style>
:root{--yellow:#ffcb05;--blue:#2a75bb;--dark:#17324d;--red:#ef5350;--muted:#697386}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#eef7ff;color:var(--dark)}header{display:flex;justify-content:space-between;align-items:center;padding:15px 24px;background:#fff;border-bottom:3px solid var(--yellow);position:sticky;top:0;z-index:10}.title{font-weight:900;font-size:23px;color:var(--blue)}button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;background:var(--blue);color:white}main{max-width:1250px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1.5fr .8fr;gap:22px}.panel{background:#fff;border-radius:22px;box-shadow:0 14px 35px rgba(42,117,187,.12);border:1px solid #dce8f1}.detail{padding:24px}.top{display:grid;grid-template-columns:280px 1fr;gap:22px;align-items:center}.art{width:100%;height:280px;object-fit:contain}.dex{font-size:13px;color:var(--muted);font-weight:800}.name{font-size:38px;font-weight:900;margin:4px 0 10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 10px;border-radius:999px;background:#e9f2ff;font-size:13px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat{background:#f7fbff;border:1px solid #deebf4;border-radius:14px;padding:13px}.stat b{display:block;font-size:22px;margin-top:4px}.moves{display:flex;gap:8px;flex-wrap:wrap}.move{background:#fff7d6;border:1px solid #ffe27e;border-radius:10px;padding:7px 9px;font-size:13px}.side{padding:18px;max-height:calc(100vh - 105px);overflow:auto;position:sticky;top:88px}.search{width:100%;padding:11px;border:1px solid #ccd7e0;border-radius:10px;margin:8px 0 12px}.list{display:grid;gap:8px}.row{display:flex;align-items:center;gap:10px;border:1px solid #e2e8f0;border-radius:12px;padding:8px;cursor:pointer}.row:hover,.row.active{background:#fff8d2;border-color:#e7c522}.row img{width:44px;height:44px;object-fit:contain}.row strong{font-size:14px}.row small{display:block;color:var(--muted)}.loading{color:var(--muted);padding:30px;text-align:center}@media(max-width:900px){main{grid-template-columns:1fr}.top{grid-template-columns:1fr;text-align:center}.side{position:static;max-height:none}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="title">포켓몬 상세 도감</div><button onclick="location.href='pokemon_main.html'">MAIN으로 돌아가기</button></header>
<main>
  <section class="panel detail" id="detail"><div class="loading">포켓몬 상세 정보를 불러오는 중...</div></section>
  <aside class="panel side"><b>전체 포켓몬 목록</b><input id="search" class="search" placeholder="이름 또는 번호 검색"><div id="list" class="list"></div></aside>
</main>
<script>
const SB_URL='https://rexjesbszxyjgbnizvof.supabase.co', SB_KEY='sb_publishable_QQo2qlO48DyRjVEmgySMFA_nwqvPLwK';let all=[],selected=+localStorage.getItem('selectedPokemonNo')||25;const $=s=>document.querySelector(s);function e(v=''){return String(v).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
async function loadList(){const r=await fetch(`${SB_URL}/rest/v1/pokemon_catalog?select=*&order=pokedex_no.asc`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});all=await r.json();renderList();if(!all.find(p=>p.pokedex_no===selected)&&all[0])selected=all[0].pokedex_no;loadDetail(selected)}
function renderList(){const q=$('#search').value.toLowerCase().trim();$('#list').innerHTML=all.filter(p=>!q||String(p.pokedex_no).includes(q)||p.display_name.toLowerCase().includes(q)||p.name_en.toLowerCase().includes(q)).map(p=>`<div class="row ${p.pokedex_no===selected?'active':''}" data-no="${p.pokedex_no}"><img src="${e(p.image_url)}"><div><strong>#${String(p.pokedex_no).padStart(3,'0')} ${e(p.display_name)}</strong><small>${e([p.type_1,p.type_2].filter(Boolean).join(' / '))}</small></div></div>`).join('');document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{selected=+r.dataset.no;localStorage.setItem('selectedPokemonNo',selected);renderList();loadDetail(selected)})}
$('#search').oninput=renderList;
async function loadDetail(no){const base=all.find(p=>p.pokedex_no===no);$('#detail').innerHTML='<div class="loading">PokeAPI에서 능력치와 기술을 불러오는 중...</div>';try{const r=await fetch(`https://pokeapi.co/api/v2/pokemon/${no}`);if(!r.ok)throw new Error('PokeAPI '+r.status);const d=await r.json();const stats=Object.fromEntries(d.stats.map(x=>[x.stat.name,x.base_stat]));const gen1Moves=d.moves.filter(m=>m.version_group_details.some(v=>['red-blue','yellow'].includes(v.version_group.name))).slice(0,18).map(m=>m.move.name);$('#detail').innerHTML=`<div class="top"><img class="art" src="${e(base?.image_url||d.sprites?.other?.['official-artwork']?.front_default||'')}"><div><div class="dex">KANTO #${String(no).padStart(3,'0')}</div><div class="name">${e(base?.display_name||d.name)}</div><div class="chips">${d.types.map(t=>`<span class="chip">${e(t.type.name)}</span>`).join('')}<span class="chip">키 ${d.height/10} m</span><span class="chip">몸무게 ${d.weight/10} kg</span></div></div></div><div class="stats"><div class="stat">HP<b>${stats.hp??'-'}</b></div><div class="stat">공격력<b>${stats.attack??'-'}</b></div><div class="stat">방어력<b>${stats.defense??'-'}</b></div><div class="stat">특수공격<b>${stats['special-attack']??'-'}</b></div><div class="stat">특수방어<b>${stats['special-defense']??'-'}</b></div><div class="stat">스피드<b>${stats.speed??'-'}</b></div></div><h3>대표 기술</h3><div class="moves">${(gen1Moves.length?gen1Moves:d.moves.slice(0,18).map(m=>m.move.name)).map(m=>`<span class="move">${e(m)}</span>`).join('')}</div>`}catch(err){$('#detail').innerHTML=`<div class="loading">상세 정보를 불러오지 못했습니다.<br>${e(err.message)}</div>`}}
loadList().catch(err=>$('#detail').innerHTML='<div class="loading">DB 연결 실패: '+e(err.message)+'</div>');
</script>
</body>
</html>
